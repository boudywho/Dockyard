# Help Menus

cmda: "Commands"
help_admintools: "\n\n`.promote <reply to user/userid/username>`\n    Promote the user in the chat.\n\n`.demote <reply to user/userid/username>`\n    Demote the user in the chat.\n\n`.ban <reply to user/userid/username> <reason>`\n    Ban the user from the chat.\n\n`.unban <reply to user/userid/username>`\n    Unban the user from the chat.\n\n`.kick <reply to user/userid/username> <reason>`\n    Kick the user from the chat.\n\n`.pin <reply to message>`\n    Pin the message in the chat.\n\n`.tpin <time> <temp pin message>`\n    Pin a message temporarily.\n\n`.unpin (all) <reply to message>`\n    Unpin messages in the chat.\n\n`.pinned`\n    Get the pinned message in the current chat.\n\n`.listpinned`\n    Get all pinned messages in the current chat.\n\n`.autodelete <24h/7d/1m/off>`\n    Enable automatic message deletion in the chat.\n\n`.purge <reply to message>`\n    Delete all messages from the replied message.\n\n`.purgeme <reply to message>`\n    Delete only your messages from the replied message.\n\n`.purgeall`\n    Delete all messages from the replied user.\n"
help_afk: "\n\n`{i}afk <optional reason>`\n    Mark yourself as away from keyboard. While active, anyone who tags or messages you receives an automatic reply.\n\n    Reply to any media with `{i}afk <reason>` to set a media file for the away message.\n"
help_antiflood: "\n\n`{i}setflood <integer>`\n    Set the flood limit in a chat.\n\n`{i}remflood`\n    Remove the flood limit from a chat.\n\n`{i}getflood`\n    Get the flood limit of a chat.\n"
help_asstcmd: "\n\n`{i}addcmd <new cmd> <reply>`\n    Set a new command for your assistant bot using the replied message.\n\n`{i}remcmd <cmd name>`\n    Remove a custom command.\n\n`{i}listcmd`\n    List all custom commands.\n"
help_audiotools: "\n\n`.makevoice <reply to audio>`\n    Create a voice note from an audio file.\n\n`.atrim <from time> - <to time>`\n    Trim audio to the given range, in seconds. Example: `.atrim 50-70`\n\n`.extractaudio <reply to media>`\n    Extract audio from the replied media.\n"
help_autoban: "\n\n`{i}autokick <on/off>`\n    Enable or disable automatic kicks for new group members.\n"
help_blacklist: "\n\n`{i}blacklist <word/all words with a space>`\n    Blacklist the chosen word in this chat.\n\n`{i}remblacklist <word>`\n    Remove the word from the blacklist.\n\n`{i}listblacklist`\n    List all blacklisted words.\n\nIf a user sends a blacklisted word, their message is deleted. You must be an administrator in the chat.\n"
help_bot: "\n\n`{i}alive` or `{i}alive inline`\n    Check that the bot is running.\n\n`{i}ping`\n    Check the BoudyOS response time.\n\n`{i}update`\n    View the changelog if an update is available.\n\n`{i}cmds`\n    View all plugin names.\n\n`{i}restart`\n    Restart the bot.\n\n`{i}logs (sys)`\n    Get the full terminal logs.\n\n`{i}logs carbon`\n    Get a carbonized image of the system logs.\n\n`{i}logs heroku`\n    Get the latest 100 lines of Heroku logs.\n\n`{i}shutdown`\n    Stop the bot.\n"
help_broadcast: "\n\n`{i}addch <id/reply to list/none>`\n    Add a chat to the database. Adds the current chat if no ID is given.\n\n`{i}remch <all/id/none>`\n    Remove the specified chat, or all chats if none is given.\n\n`{i}broadcast <reply to msg>`\n    Send the replied message to all chats in the database.\n\n`{i}forward <reply to msg>`\n    Forward the message to all chats in the database.\n\n`{i}listchannels`\n    List all added chats.\n"
help_button: "\n\n`{i}button <text with button format>`\n    Create a button. You can also reply to an image.\n\nFormat: `{i}button Hey There!\n[BoudyOS | https://github.com/boudywho/BoudyOS][Support | https://github.com/boudywho/BoudyOS/issues | same]\n[Repository | https://github.com/boudywho/BoudyOS]`\n"
help_calculator: "\n\n`{i}calc`\n    Open the inline calculator.\n"
help_channelhacks: "\n\n`{i}shift <from channel> | <to channel>`\n    Transfer all existing posts from channel A to channel B. Usernames or IDs are accepted.\n    Example: `{i}shift @abc | @xyz`\n    The ` | ` separator is required.\n\nTo auto-post or forward all new messages from a source channel to a destination channel:\n\n`{i}asource <channel username or id>`\n    Add a source channel to the database.\n\n`{i}dsource <channel username or id>`\n    Remove a source channel from the database.\n\n`{i}listsource`\n    List source channels.\n\n`{i}adest <channel username or id>`\n    Add a destination channel to the database.\n\n`{i}ddest <channel username or id>`\n    Remove a destination channel from the database.\n\n`{i}listdest`\n    List destination channels.\n\nMultiple channels can be stored. To enable auto-posting, use `{i}setdb AUTOPOST True`.\n"
help_chats: "\n\n`{i}delchat <optional- username/id>`\n    Delete the group where this command is used.\n\n`{i}getlink`\n    Get a link to the group where this command is used.\n\n`{i}getlink r`\n    Create a link with admin approval.\n\n`{i}getlink r title_here`\n    Create an admin-approval link with a title.\n\n`{i}getlink 10`\n    Create a link with a usage limit.\n\n`{i}create (g|b|c) <group_name> ; <optional-username>`\n    Create a group with the given name.\n    g - megagroup or supergroup\n    b - small group\n    c - channel\n\n`{i}setgpic <reply to Photo><chat username>`\n    Set the group profile photo.\n\n`{i}delgpic <chat username -optional>`\n    Delete the group profile photo.\n\n`{i}unbanall`\n    Unban all members of a group.\n\n`{i}rmusers`\n    Remove specific users.\n"
help_converter: "\n\n`{i}convert <gif/img/sticker/webm>`\n    Reply to media to convert it to a GIF, image, WebM, or normal sticker.\n\n`{i}doc <filename.ext>`\n    Reply to a text message to save it as a file.\n\n`{i}open`\n    Reply to a file to reveal its text.\n\n`{i}rename <file name with extension>`\n    Rename the file.\n\n`{i}thumbnail <reply to image/thumbnail file>`\n    Upload the file with a custom thumbnail.\n"
help_core: "\n\n`{i}install <reply to plugin>`\n    Install the plugin. Use `{i}install f` to force installation.\n\n`{i}uninstall <plugin name>`\n    Unload and remove the plugin.\n\n`{i}load <plugin name>`\n    Load an unloaded unofficial plugin.\n\n`{i}unload <plugin name>`\n    Unload an unofficial plugin.\n\n`{i}help <plugin name>`\n    Show the help menu for a plugin.\n\n`{i}getaddons <raw link to code>`\n    Load plugins from the given raw link.\n"
help_database: "\n\n**Database commands. Use only if you understand them.**\n\n`{i}setdb key | value`\n    Set a value in the database.\n    Examples:\n    `{i}setdb hi there`\n    `{i}setdb hi there | ultroid here`\n    `{i}setdb --extend variable value` or `{i}setdb -e variable value` to append to existing values.\n\n`{i}deldb key`\n    Delete a key from the database.\n\n`{i}rendb old keyname | new keyname`\n    Rename a key.\n"
help_downloadupload: "\n\n`{i}ul <path/to/file>`\n    Upload files to Telegram. The following arguments may be used before or after the filename:\n      `--stream` uploads as a stream.\n      `--delete` deletes the file after uploading.\n      `--no-thumb` uploads without a thumbnail.\n\n`{i}dl <filename(optional)>`\n    Reply to a file to download it.\n\n`{i}download <DDL> (| filename)`\n    Download using a direct link. A filename is generated if none is given.\n"
help_echo: "\n\n`{i}addecho <reply to anyone>`\n    Start automatic echoing of the replied user's messages.\n\n`{i}remecho <reply to anyone>`\n    Stop echoing.\n\n`{i}listecho <reply to anyone>`\n    List users with echo enabled.\n"
help_extra: "\n\n`{i}del <reply to message>`\n    Delete the replied message.\n\n`{i}edit <new message>`\n    Edit your last message or the replied message.\n\n`{i}copy <reply to message>`\n    Copy the replied message or media.\n\n`{i}reply`\n    Reply to the last message you received.\n"
help_fedutils: "\n\n`{i}superfban <reply to user/userid/username>`\n    Ban the user across all federations where you are an administrator.\n\n`{i}superunfban <reply to user/userid/username>`\n    Unban the user across all federations where you are an administrator.\n\nSpecify the federation ban group and excluded federations in the assistant.\n\n`{i}fstat <username/id/reply to user>`\n    Collect federation status for the user from Rose.\n\n`{i}fedinfo <(fedid)>`\n    Collect federation information for the given federation ID, or for the federation you own, from Rose.\n"
help_fileshare: "\n\n`{i}store <reply_to_message>`\n    Store the replied message or media and generate a shareable link accessible through your assistant bot.\n\n`{i}delstored <link of stored file>`\n    Delete a stored file.\n\n`{i}liststored`\n    List all stored messages.\n\nUse `filestore` inline with your assistant bot to view stored files.\n"
help_filter: "\n\n`{i}addfilter <word><reply to a message>`\n    Add the given word as a filter for the replied message.\n\n`{i}remfilter <word>`\n    Remove a filter.\n\n`{i}listfilter`\n    List all filters.\n"
help_fontgen: "\n\n`{i}font <font name> : <text>`\n    Generate the text in a different font.\n\n`{i}font`\n    List available fonts.\n"
help_giftools: "\n\n`{i}invertgif`\n    Invert the colors of a GIF.\n\n`{i}bwgif`\n    Convert a GIF to black and white.\n\n`{i}rvgif`\n    Reverse a GIF.\n\n`{i}vtog`\n    Reply to a video to convert it to a GIF.\n\n`{i}gif <query>`\n    Send a video matching the query.\n"
help_globaltools: "\n\n`{i}gban <reply user/ username>`\n    Ban the user globally.\n\n`{i}ungban <reply user/ username>`\n    Unban the user globally.\n\n`{i}gstat <reply to user/userid/username>`\n    Check whether the user is globally banned.\n\n`{i}listgban`\n    List all globally banned users.\n\n`{i}gmute <reply user/ username>`\n    Mute the user globally.\n\n`{i}ungmute <reply user/ username>`\n    Unmute the user globally.\n\n`{i}gkick <reply/username>`\n    Kick the user globally.\n\n`{i}gcast <text/reply>`\n    Send a message to all groups.\n\n`{i}gadmincast <text/reply>`\n    Broadcast to all chats where you are an administrator.\n\n`{i}gucast <text/reply>`\n    Send a message to all private users.\n\n`{i}gblacklist <chat id/username/nothing (for current chat)>`\n    Add a chat to the blacklist and exclude it from global broadcasts.\n\n`{i}ungblacklist`\n    Remove the chat from the blacklist.\n\n`{i}gpromote <reply to user> <channel/group/all> <rank>`\n    Promote the user wherever you are an administrator.\n    Use group, channel, or all to choose the scope.\n    Examples:\n    `gpromote group boss` promotes the user in all groups.\n    `gpromote @username all sar` promotes the user in all groups and channels.\n\n`{i}gdemote`\n    Demote the user globally.\n"
help_greetings: "\n\n**Welcome messages**\n\n`{i}setwelcome <message/reply to message>`\n    Set the welcome message in the current chat.\n\n`{i}clearwelcome`\n    Delete the welcome message in the current chat.\n\n`{i}getwelcome`\n    Get the welcome message in the current chat.\n\n**Goodbye messages**\n\n`{i}setgoodbye <message/reply to message>`\n    Set the goodbye message in the current chat.\n\n`{i}cleargoodbye`\n    Delete the goodbye message in the current chat.\n\n`{i}getgoodbye`\n    Get the goodbye message in the current chat.\n\n`{i}thankmembers on/off`\n    Send a thank-you sticker when a group reaches each multiple of 100 members.\n"
help_imagetools: "\n\n`{i}border <reply to photo/sticker>`\n    Create a border around the media.\n    Examples:\n    `{i}border 12,22,23`\n    `{i}border 12,22,23 ; width (in number)`\n\n`{i}grey <reply to any media>`\n    Convert the media to black and white.\n\n`{i}color <reply to any black and white media>`\n    Restore color to the media.\n\n`{i}toon <reply to any media>`\n    Apply a cartoon effect.\n\n`{i}danger <reply to any media>`\n    Apply a danger effect.\n\n`{i}negative <reply to any media>`\n    Create a negative image.\n\n`{i}blur <reply to any media>`\n    Blur the media.\n\n`{i}quad <reply to any media>`\n    Create a vortex effect.\n\n`{i}mirror <reply to any media>`\n    Create a mirror image.\n\n`{i}flip <reply to any media>`\n    Flip the media.\n\n`{i}sketch <reply to any media>`\n    Convert the media to a sketch.\n\n`{i}blue <reply to any media>`\n    Apply a blue tint.\n\n`{i}csample <color name /color code>`\n    Show a color sample.\n    Examples:\n    `{i}csample red`\n    `{i}csample #ffffff`\n\n`{i}pixelator <reply image>`\n    Create a pixelated image.\n"
help_instagram: "\n\n`{i}instadl <Instagram Url>`\n    Download Instagram media.\n\n`{i}instadata <username>`\n    Get Instagram data for a user or yourself.\n\n`{i}instaul <reply video/photo> <caption>`\n    Upload media to Instagram.\n\n`{i}igtv <reply video> <caption>`\n    Upload media to IGTV.\n\n`{i}reels <reply video> <caption>`\n    Upload media to Instagram Reels.\n\nUse the `instatm` inline query with your assistant to view the home page posts.\n\nSet `INSTA_USERNAME` and `INSTA_PASSWORD` before use.\n"
help_locks: "\n\n`{i}lock <msgs/media/sticker/gif/games/inline/polls/invites/pin/changeinfo>`\n    Lock the selected setting in the group.\n\n`{i}unlock <msgs/media/sticker/gif/games/inline/polls/invites/pin/changeinfo>`\n    Unlock the selected setting in the group.\n"
help_mediatools: "\n\n`{i}mediainfo <reply to media>`\n    Get information about the media.\n\n`{i}rotate <degree/angle> <reply to media>`\n    Rotate a video, photo, or other media. Video rotation must use a multiple of 90 degrees.\n"
help_mute: "\n\n`{i}mute <reply to msg/ user id>`\n    Mute the user in the current chat.\n\n`{i}unmute <reply to msg/ user id>`\n    Unmute the user in the current chat.\n\n`{i}dmute <reply to msg/ user id>`\n    Mute the user in the current chat by deleting their messages.\n\n`{i}undmute <reply to msg/ use id>`\n    Unmute a deleted-message mute.\n\n`{i}tmute <time> <reply to msg/ use id>`\n    Mute the user for a set time.\n    s - seconds\n    m - minutes\n    h - hours\n    d - days\n"
help_notes: "\n\n`{i}addnote <word><reply to a message>`\n    Save the replied message as a note with the chosen word.\n\n`{i}remnote <word>`\n    Remove a note from the current chat.\n\n`{i}listnote`\n    List all notes.\n\nSet notes in a group so all members can use them. Type `#(note keyword)` to retrieve a note.\n"
help_other: "\n\n`{i}send <username/id> <reply/type>`\n    Send a message to a user or chat.\n\n`{i}fwdreply <reply to msg>`\n    Reply to a message by forwarding it privately.\n\n`{i}save <reply message>`\n    Save the replied message to your saved messages.\n\n`{i}fsave <reply message>`\n    Forward the replied message to your saved messages.\n"
help_pmpermit: "\n\n`{i}a` or `{i}approve`\n    Approve a user to send private messages.\n\n`{i}da` or `{i}disapprove`\n    Disapprove a user from sending private messages.\n\n`{i}block`\n    Block a user.\n\n`{i}unblock` or `{i}unblock all`\n    Unblock a user, or all users.\n\n`{i}nologpm`\n    Stop logging messages from the user.\n\n`{i}logpm`\n    Start logging messages from the user.\n\n`{i}startarchive`\n    Archive new private messages.\n\n`{i}stoparchive`\n    Stop archiving new private messages.\n\n`{i}cleararchive`\n    Unarchive all chats.\n\n`{i}listapproved`\n    List all approved private chats.\n"
help_polls: "\n\n`{i}poll <question> ; <option> ; <option>`\n    Create an anonymous poll with the given options.\n\n`{i}poll <question> ; <option> ; <option> | <type>`\n    Create a poll of the given type. Type may be `public`, `multiple`, or `quiz`.\n\n`{i}poll <question> ; <option> ; <option> | quiz_<answerno>`\n    Create a quiz poll where answerno is the number of the correct option.\n"
help_profile: "\n\n`{i}setname <first name // last name>`\n    Change your profile name.\n\n`{i}setbio <bio>`\n    Change your profile bio.\n\n`{i}setpic <reply to pic>`\n    Change your profile photo.\n\n`{i}delpfp <n>(optional)`\n    Delete one profile photo, or n photos if a number is given.\n\n`{i}poto <username>`\n    Upload the photo of a chat or user if available.\n"
help_qrcode: "\n\n`{i}qrcode <text/reply to text>`\n    Create a QR code from the text.\n\n`{i}addqr <reply image> <text>`\n    Create a QR code from the text and add it to the image.\n\n`{i}qrdecode <reply to qrcode>`\n    Decode the QR code.\n"
help_resize: "\n\n`{i}size <reply to media>`\n    Get the dimensions of the media.\n\n`{i}resize <number> <number>`\n    Resize the image to the given width and height.\n    Example: `{i}resize 690 960`\n"
help_schedulemsg: "\n\n`{i}schedule <text/reply to msg> <time>`\n    Schedule a message. The time may be a number of seconds or a value such as 1h or 1m.\n    Example: `{i}schedule Hello 100` sends the message after 100 seconds.\n    Example: `{i}schedule Hello 1h` sends the message after one hour.\n"
help_search: "\n\n`{i}saavn <search query>`\n    Download songs from Saavn.\n\n`{i}google <query>`\n    Search Google.\n\n`{i}github <username>`\n    Get the full GitHub profile for a user.\n\n`{i}img <query>`\n    Search for images.\n    `{i}img <query> ; <no of results>` returns a specific number of results.\n\n`{i}reverse`\n    Reply to an image or sticker to find its source.\n"
help_snips: "\n\n`{i}addsnip <word><reply to a message>`\n    Save the replied message as a snippet with the chosen word.\n\n`{i}remsnip <word>`\n    Remove a snippet.\n\n`{i}listsnip`\n    List all snippets.\n\nType `$(your snippet word)` to retrieve a saved snippet.\n"
help_stickertools: "\n\n`{i}destroy <reply to animated sticker>`\n    Destroy the sticker.\n\n`{i}tiny <reply to media>`\n    Create a tiny sticker.\n\n`{i}kang <reply to image/sticker>`\n    Add the sticker to your pack.\n\n`{i}packkang <pack name>`\n    Copy the complete sticker set with a custom name.\n\n`{i}round <reply to any media>`\n    Extract a round sticker.\n"
help_sudo: "\n\n`{i}addsudo`\n    Add sudo users by replying to a user or listing space-separated user IDs.\n\n`{i}delsudo`\n    Remove sudo users by replying to a user or listing space-separated user IDs.\n\n`{i}listsudo`\n    List all sudo users.\n"
help_tag: "\n\n`{i}tagall`\n    Tag the first 100 members of the chat.\n\n`{i}tagadmins`\n    Tag the chat administrators.\n\n`{i}tagowner`\n    Tag the chat owner.\n\n`{i}tagbots`\n    Tag the bots in the chat.\n\n`{i}tagrec`\n    Tag recently active members.\n\n`{i}tagon`\n    Tag online members. Only works when privacy settings allow it.\n\n`{i}tagoff`\n    Tag offline members. Only works when privacy settings allow it.\n"
help_tools: "\n\n`{i}circle`\n    Reply to an audio file or GIF to create a video note.\n\n`{i}ls`\n    List all files in a directory.\n\n`{i}bots`\n    Show the bots in the current chat with their permalinks.\n\n`{i}hl <a link> <text-optional>`\n    Embed a link with whitespace as the message.\n\n`{i}id`\n    Reply to a sticker to get its ID, reply to a user to get their ID, or use it without a reply to get the chat ID.\n\n`{i}sg <reply to a user><username/id>`\n    Get the name history of the replied user.\n\n`{i}tr <dest lang code> <(reply to) a message>`\n    Translate a message.\n\n`{i}webshot <url>`\n    Capture a screenshot of a web page.\n\n`{i}shorturl <url> <id-optional>`\n    Shorten a URL.\n"
help_usage: "\n\n`{i}usage`\n    Get overall usage.\n\n`{i}usage heroku`\n    Get Heroku statistics.\n\n`{i}usage db`\n    Get database storage usage.\n"
help_utilities: "\n\n`{i}kickme`\n    Leave the group.\n\n`{i}date`\n    Show the calendar.\n\n`{i}listreserved`\n    List all usernames for channels and groups you own.\n\n`{i}stats`\n    Show your profile statistics.\n\n`{i}paste`\n    Include long text or reply to a text file.\n\n`{i}info <username/userid/chatid>`\n    Show information about a user or chat. Reply to a message to target its sender.\n\n`{i}invite <username/userid>`\n    Add a user to the chat.\n\n`{i}rmbg <reply to pic>`\n    Remove the background from an image.\n\n`{i}telegraph <reply to media/text>`\n    Upload media or text to Telegraph.\n\n`{i}json <reply to msg>`\n    Get the JSON encoding of the message.\n\n`{i}suggest <reply to message> or <poll title>`\n    Create a yes/no poll for the replied suggestion.\n\n`{i}ipinfo <ipAddress>`\n    Get information about an IP address.\n\n`{i}cpy <reply to message>`\n    Copy the replied message with formatting. The copy expires after 24 hours.\n\n`{i}pst`\n    Paste the copied message with formatting.\n\n`{i}thumb <reply file>`\n    Download the thumbnail of the replied file.\n\n`{i}getmsg <message link>`\n    Get messages from chats with forwarding or copying restrictions.\n"
help_variables: "\n\n`{i}get var <variable name>`\n    Get the value of a variable.\n\n`{i}get type <variable name>`\n    Get the type of a variable.\n\n`{i}get db <key>`\n    Get the database value for a key.\n\n`{i}get keys`\n    List all Redis keys.\n"
help_vctools: "\n\n`{i}startvc`\n    Start a group call.\n\n`{i}stopvc`\n    Stop the group call.\n\n`{i}vctitle <title>`\n    Change the group call title.\n\n`{i}vcinvite`\n    Invite all group members to the group call. You must have joined the call.\n"
help_videotools: "\n\n`{i}sample <duration in seconds>`\n    Create a short sample of a video.\n\n`{i}vshots <number of shots>`\n    Create screenshots from a video.\n\n`{i}vtrim <start time> - <end time> in seconds`\n    Trim a video to the given range.\n"
help_warn: "\n\n`{i}warn <reply to user> <reason>`\n    Warn a user.\n\n`{i}resetwarn <reply to user>`\n    Reset all warnings for a user.\n\n`{i}warns <reply to user>`\n    List the warnings for a user.\n\n`{i}setwarn <warn count> | <ban/mute/kick>`\n    Set the number of warnings and the action to take when the limit is reached.\n    The default is three warnings followed by a kick.\n    Example: `setwarn 5 | mute`\n"
help_webupload: "\n\n`{i}webupload`\n    Upload files to another server.\n"
help_ziptools: "\n\n`{i}zip <reply to file>`\n    Zip the replied file.\n    To set a password: `{i}zip <password>` as a reply to the file.\n\n`{i}unzip <reply to zip file>`\n    Unzip the replied file.\n\n`{i}azip <reply to file>`\n    Add a file to the batch for a batch zip upload.\n\n`{i}dozip`\n    Create and upload a batch zip of the files added with `{i}azip`.\n    To set a password: `{i}dozip <password>`\n"
