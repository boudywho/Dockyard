# Shared roots must exist before systemd constructs service namespaces.
# RuntimeDirectory=/StateDirectory= on the application units apply the
# service-account ownership required by /run/dockyard and app-status.
d /opt/dockyard 0755 root root -
# Native activation has no /opt selector; remove a stale pre-2.2 symlink/file.
r /opt/dockyard/current - - - -
d /var/lib/dockyard 0755 root root -
d /var/lib/dockyard/status 0755 root root -
d /run/dockyard 0755 root root -
d /run/lock/dockyard 0750 root root -
d /var/backups/dockyard 0700 root root -
